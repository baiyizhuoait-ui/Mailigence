<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mailigence · 邮件聚合分析</title>
    <!-- System fonts only: no external CDN dependency (Google Fonts is
         unreachable behind some networks and causes ERR_ABORTED). -->
  </head>
  <body>
    <script>
      // Apply saved theme before React mounts to prevent FOUC.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("emailui-settings") || "{}");
          document.documentElement.setAttribute("data-theme", s.theme || "dark");
          document.documentElement.setAttribute("data-accent", s.accent || "amber");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.setAttribute("data-accent", "amber");
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
