server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API traffic is proxied container-to-container to the backend service
    # (same-origin from the browser's perspective, so no CORS involved).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-running endpoints (SSE chat stream, capability/context probes,
        # memory distillation) can take 1-2 minutes; the default 60s read
        # timeout would cut them off with a 504.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Disable response buffering so SSE / streaming answers reach the
        # browser token-by-token instead of being held until the stream ends.
        proxy_buffering off;
    }

    # SPA routing fallback — any non-file path serves index.html so client
    # routes (and a hard refresh on them) keep working.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
